name: PYVoiceAgent V1.9.8 manual voice regression

on:
  push:
    paths:
      - 'pyvoiceagent/**'
      - '.github/workflows/pyvoiceagent-v198.yml'
  pull_request:
    paths:
      - 'pyvoiceagent/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manual-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile candidate and existing modules
        run: |
          python -m py_compile pyvoiceagent/agent_core_1_9_8.py
          python -m py_compile pyvoiceagent/bu_calendar_module.py
          python -m py_compile pyvoiceagent/history_center_v194.py
      - name: Manual recorder and AI clarification regression
        run: python -m unittest discover -s pyvoiceagent/tests -p test_manual_voice_v198.py -v
      - name: Preserve prior successful voice, history and calendar functionality
        run: |
          python -m unittest discover -s pyvoiceagent/tests -p test_voice_history_v197.py -v
          python -m unittest discover -s pyvoiceagent/tests -p test_bu_calendar_v196.py -v
          python -m unittest discover -s pyvoiceagent/tests -p test_bu_snap_v191.py -v
          python -m unittest discover -s pyvoiceagent/tests -p test_bu_snap_v192.py -v
