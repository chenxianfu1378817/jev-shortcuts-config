name: Validate PYVoiceAgent 1.7.7 date-only work capture

on:
  push:
    branches: [main, fix/date-only-work-177]
    paths:
      - 'pyvoiceagent/agent_core_1_7_7.py'
      - 'pyvoiceagent/tests/test_date_only_work_177.py'
      - '.github/workflows/pyvoiceagent-date-only-177.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and date-only safety tests
        run: |
          python -m py_compile pyvoiceagent/agent_core_1_7_7.py
          python -m unittest discover -s pyvoiceagent/tests -p 'test_date_only_work_177.py' -v
      - name: Old calendar and AI intent regression
        run: |
          python -m unittest discover -s pyvoiceagent/tests -p 'test_natural_work_plan_176.py' -v
      - name: Release digest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          data=Path('pyvoiceagent/agent_core_1_7_7.py').read_bytes()
          print('SHA256='+hashlib.sha256(data).hexdigest())
          print('BYTES='+str(len(data)))
          PY
