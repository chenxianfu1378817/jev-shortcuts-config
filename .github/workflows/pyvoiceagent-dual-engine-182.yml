name: Validate PYVoiceAgent 1.8.2 dual engine

on:
  push:
    branches: [main]
    paths:
      - 'pyvoiceagent/agent_core_1_8_2.py'
      - 'pyvoiceagent/tests/test_dual_engine_182.py'
      - 'pyvoiceagent/manifest.json'
      - '.github/workflows/pyvoiceagent-dual-engine-182.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test new local-AI dispatch engine
        run: |
          python -m py_compile pyvoiceagent/agent_core_1_8_2.py
          python -m unittest discover -s pyvoiceagent/tests -p 'test_dual_engine_182.py' -v
      - name: Previous releases regression
        run: |
          python -m unittest discover -s pyvoiceagent/tests -p 'test_clipboard_contacts_181.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_app_route_180.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_shortcut_builder_179.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_date_only_work_178.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_natural_work_plan_176.py' -v
      - name: Verify update manifest if published
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('pyvoiceagent/manifest.json').read_text())
          candidate=Path('pyvoiceagent/agent_core_1_8_2.py').read_bytes()
          print('1.8.2 Candidate SHA256:',hashlib.sha256(candidate).hexdigest())
          print('1.8.2 Candidate bytes:',len(candidate))
          if m['version']!='1.8.2':
              print('1.8.2 not published yet. Test candidate passed.')
          else:
              assert m['sequence']==182 and m['path']=='agent_core_1_8_2.py'
              b=Path('pyvoiceagent/agent_core_1_8_2.py').read_bytes()
              assert m['size_bytes']==len(b)
              assert m['sha256']==hashlib.sha256(b).hexdigest()
              print('Verified',len(b),m['sha256'])
          PY
