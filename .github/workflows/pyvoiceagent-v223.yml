name: PYVoiceAgent V2.2.3 safe microphone stop and iPhone WebView regression
on:
  push:
    paths:
      - 'pyvoiceagent/**'
      - '.github/workflows/pyvoiceagent-v223.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audio-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile candidate engine and new chat module
        run: |
          python -m py_compile pyvoiceagent/agent_core_2_2_3.py
          python -m py_compile pyvoiceagent/chat_shell_v223.py
      - name: Microphone stop lifecycle and strict update size checks
        run: python -m unittest discover -s pyvoiceagent/tests -p 'test_audio_stop_v223.py' -v
      - name: Legacy chat, permissions, app, BU and update regression
        run: |
          python -m unittest discover -s pyvoiceagent/tests -p 'test_chat_shell_v220.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_chat_shell_v221.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_release_compat_v222.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_manual_voice_v198.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_lifecycle_v201.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_result_center_v200.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_amap_native_v199.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_bu_calendar_v196.py' -v
