name: PYVoiceAgent V2.0.0 native result UI regression
on:
  push:
    paths:
      - 'pyvoiceagent/**'
      - '.github/workflows/pyvoiceagent-v200.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile complete candidate core and result module
        run: |
          python -m py_compile pyvoiceagent/agent_core_2_0_0.py
          python -m py_compile pyvoiceagent/result_center_v200.py
      - name: New app-like results calendar and voice handoff regressions
        run: python -m unittest discover -s pyvoiceagent/tests -p 'test_result_center_v200.py' -v
      - name: Existing voice BU Calendar and navigation regressions
        run: |
          python -m unittest discover -s pyvoiceagent/tests -p 'test_manual_voice_v198.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_amap_native_v199.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_bu_calendar_v196.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_bu_snap_v192.py' -v
