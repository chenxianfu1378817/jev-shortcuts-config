name: PYVoiceAgent V1.8.4 interactive clarifications
on:
  pull_request:
    paths:
      - 'pyvoiceagent/agent_core_1_8_4.py'
      - 'pyvoiceagent/tests/test_interactive_184.py'
      - '.github/workflows/pyvoiceagent-interactive-184.yml'
      - 'pyvoiceagent/manifest.json'
  push:
    branches: [main]
    paths:
      - 'pyvoiceagent/agent_core_1_8_4.py'
      - 'pyvoiceagent/tests/test_interactive_184.py'
      - '.github/workflows/pyvoiceagent-interactive-184.yml'
      - 'pyvoiceagent/manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile current interactive engine
        run: python -m py_compile pyvoiceagent/agent_core_1_8_4.py
      - name: Latest engine conversation and safety regressions
        run: python -m unittest discover -s pyvoiceagent/tests -p 'test_interactive_184.py' -v
      - name: Legacy module regressions (separate historical engine versions)
        run: |
          python -m unittest discover -s pyvoiceagent/tests -p 'test_clipboard_contact_speech_183.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_dual_engine_182.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_clipboard_contacts_181.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_app_route_180.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_shortcut_builder_179.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_date_only_work_178.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_natural_work_plan_176.py' -v
      - name: Print release hash; validate if published
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          path=Path('pyvoiceagent/agent_core_1_8_4.py')
          body=path.read_bytes()
          digest=hashlib.sha256(body).hexdigest()
          print('V1.8.4 SHA256:',digest)
          print('V1.8.4 bytes:',len(body))
          manifest=json.loads(Path('pyvoiceagent/manifest.json').read_text())
          if manifest['version']=='1.8.4':
              assert manifest['sequence']==184
              assert manifest['path']=='agent_core_1_8_4.py'
              assert manifest['sha256']==digest
              assert manifest['size_bytes']==len(body)
          PY
