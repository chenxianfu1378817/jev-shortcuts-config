name: PYVoiceAgent V2.0.1 UI return regression
on:
  push:
    paths:
      - 'pyvoiceagent/**'
      - '.github/workflows/pyvoiceagent-v201.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile current engine
        run: python -m py_compile pyvoiceagent/agent_core_2_0_1.py
      - name: UI task / callback lifecycle regression
        run: python -m unittest discover -s pyvoiceagent/tests -p 'test_lifecycle_v201.py' -v
      - name: Existing native UI, manual voice, calendar, map and BU regressions
        run: |
          python -m unittest discover -s pyvoiceagent/tests -p 'test_result_center_v200.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_manual_voice_v198.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_amap_native_v199.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_bu_calendar_v196.py' -v
