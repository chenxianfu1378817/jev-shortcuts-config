name: PYVoiceAgent V2.2.5 local Shortcuts agent and exit regression
on:
  push:
    paths:
      - 'pyvoiceagent/**'
      - '.github/workflows/pyvoiceagent-v225.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shortcuts-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and legacy updater size
        run: |
          python -m py_compile pyvoiceagent/agent_core_2_2_5.py
          python -m py_compile pyvoiceagent/shortcut_tools_v225.py
          python -m py_compile pyvoiceagent/shortcut_ui_v225.py
          test $(wc -c < pyvoiceagent/agent_core_2_2_5.py) -le 350000
      - name: Registered Shortcuts CRUD, local and AI routing, confirmation and exit
        run: python -m unittest discover -s pyvoiceagent/tests -p 'test_registered_shortcuts_v225.py' -v
      - name: Existing keyboard, voice, chat, calendar and navigation regressions
        run: |
          python -m unittest discover -s pyvoiceagent/tests -p 'test_keyboard_v224.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_audio_stop_v223.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_chat_shell_v220.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_chat_shell_v221.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_release_compat_v222.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_manual_voice_v198.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_lifecycle_v201.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_result_center_v200.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_amap_native_v199.py' -v
          python -m unittest discover -s pyvoiceagent/tests -p 'test_bu_calendar_v196.py' -v
