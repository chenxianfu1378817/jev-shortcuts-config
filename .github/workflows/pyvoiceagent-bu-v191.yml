name: PYVoiceAgent BU snapshot offline regression

on:
  push:
    paths:
      - 'pyvoiceagent/**'
      - '.github/workflows/pyvoiceagent-bu-v191.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile V1.9.2 core and BU module
        run: |
          python -m py_compile pyvoiceagent/agent_core_1_9_2.py
          python -m py_compile pyvoiceagent/bu_snapshot_module.py
      - name: BU initial mocked-feed regression
        run: python -m unittest discover -s pyvoiceagent/tests -p test_bu_snap_v191.py -v
      - name: BU stale-quote safety regression
        run: python -m unittest discover -s pyvoiceagent/tests -p test_bu_snap_v192.py -v
