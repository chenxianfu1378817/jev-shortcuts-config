name: PYVoiceAgent V1.6 Practical Tools Tests

on:
  push:
    branches: [dev/pyvoiceagent-v1-6-practical-tools]
    paths:
      - 'pyvoiceagent/agent_core_1_6_0.py'
      - 'pyvoiceagent/v1_6_0/**'
      - '.github/workflows/pyvoiceagent-v160-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python -m py_compile pyvoiceagent/agent_core_1_6_0.py
          python -m compileall -q pyvoiceagent/v1_6_0
      - name: Practical tools tests
        run: python -m unittest discover -v -s pyvoiceagent/v1_6_0 -p 'test_*.py'
      - name: Run all 80 previous safety regressions against new engine
        run: |
          cp -R pyvoiceagent/v1_5_3 pyvoiceagent/v1_6_0_compat
          find pyvoiceagent/v1_6_0_compat -name 'test_*.py' -type f -exec sed -i 's/agent_core_1_5_3.py/agent_core_1_6_0.py/g' {} +
          python -m unittest discover -v -s pyvoiceagent/v1_6_0_compat -p 'test_*.py'
