name: PYVoiceAgent V3 candidate verification
on:
  push:
    branches: [main, v3/phase1-pure-python-core]
    paths:
      - 'pyvoiceagent_v3/**'
      - '.github/workflows/pyvoiceagent-v3-mobile.yml'
  pull_request:
    paths:
      - 'pyvoiceagent_v3/**'
      - 'pyvoiceagent/agent_core_3_0_3.py'
      - 'pyvoiceagent/manifest.json'
      - '.github/workflows/pyvoiceagent-v3-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pyvoiceagent-v3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the complete V3 regression suite
        run: python -m unittest discover -s pyvoiceagent_v3/tests -v
